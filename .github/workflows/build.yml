# Alpa Player - otomatik derleme (GitHub Actions)
# Her push'ta Android APK + AAB ve imzasiz iOS paketi uretir.
# Ciktilar: GitHub > Actions > ilgili calisma > "Artifacts" bolumu.
name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
            echo "$KEY_PROPERTIES" > android/key.properties
          fi
      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter build apk --release
      - run: flutter build appbundle --release
      - name: Publish build to a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" --prerelease --title "Alpa Player derleme ${{ github.run_number }}" \
            --notes "Otomatik derleme (${{ github.sha }})" \
            build/app/outputs/flutter-apk/app-release.apk \
            build/app/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v4
        with:
          name: alpa-player-android
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab

  screenshots:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Check demo video URLs
        run: |
          grep -oE "https://[^']+" lib/demo_content.dart | sort -u | while read u; do
            echo "URLCHECK $(curl -sL -o /dev/null -r 0-1000 -w '%{http_code}' "$u") $u"
          done
      - name: Take store screenshots on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: flutter drive --driver=test_driver/integration_test.dart --target=integration_test/screenshots_test.dart
      - name: Publish screenshots
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la screenshots || exit 0
          cd screenshots && zip -q ../screenshots.zip *.png && cd ..
          gh release create "screenshots-${{ github.run_number }}" --prerelease \
            --title "Ekran goruntuleri ${{ github.run_number }}" --notes "Otomatik" screenshots.zip

  ios:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr alpa-player-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: alpa-player-ios-unsigned
          path: alpa-player-unsigned.ipa
