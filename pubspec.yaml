name: alpa_player
description: Alpa Player - Xtream Codes uyumlu, reklam destekli ücretsiz IPTV oynatıcı.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  flutter_secure_storage: ">=9.0.0 <12.0.0"
  shared_preferences: ^2.3.0
  google_mobile_ads: ">=6.0.0 <10.0.0"
  media_kit: ^1.1.10
  media_kit_video: ">=1.2.4 <3.0.0"
  media_kit_libs_video: ^1.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ">=4.0.0 <7.0.0"

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
